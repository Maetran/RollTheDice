limit_req_zone $binary_remote_addr zone=zdwa_http_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=zdwa_connections_per_ip:10m;

upstream rollthedice_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    server_name zockdiewandan.online www.zockdiewandan.online;
    client_max_body_size 128k;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        limit_req zone=zdwa_http_per_ip burst=80 nodelay;
        proxy_pass http://rollthedice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        limit_conn zdwa_connections_per_ip 30;
        proxy_pass http://rollthedice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/zockdiewandan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zockdiewandan.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name zockdiewandan.online www.zockdiewandan.online;
    return 301 https://$host$request_uri;
}
