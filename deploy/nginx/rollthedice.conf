limit_req_zone $binary_remote_addr zone=zdwa_http_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=zdwa_connections_per_ip:10m;

upstream rollthedice_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Never serve the application for an unknown TLS name.  This matters because
# the shared session cookie is scoped to the parent domain: only explicitly
# configured, trusted product hosts may reach the backend.
server {
    listen [::]:443 ssl http2 default_server ipv6only=on;
    listen 443 ssl http2 default_server;
    ssl_reject_handshake on;
}

server {
    server_name
        zockdiewandan.online
        www.zockdiewandan.online
        zilch.zockdiewandan.online;
    client_max_body_size 128k;

    # `add_header` is inherited only when the child context has no own
    # `add_header`.  Keep the complete set here together with the app-specific
    # CSP; otherwise the CSP would shadow the headers from conf.d/security.conf.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        limit_req zone=zdwa_http_per_ip burst=80 nodelay;
        proxy_pass http://rollthedice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /ws/ {
        limit_conn zdwa_connections_per_ip 30;
        proxy_pass http://rollthedice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/zockdiewandan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zockdiewandan.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name zdwa.zockdiewandan.online;

    # ZDWA keeps its established origin. This preserves installed PWAs,
    # host-only legacy sessions and origin-bound guest/rejoin storage.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Cache-Control "no-store" always;

    return 308 https://zockdiewandan.online$request_uri;

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/zockdiewandan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zockdiewandan.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name zockdiewandan.online;
    return 308 https://zockdiewandan.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.zockdiewandan.online;
    return 308 https://www.zockdiewandan.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name zilch.zockdiewandan.online;
    return 308 https://zilch.zockdiewandan.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name zdwa.zockdiewandan.online;
    return 308 https://zockdiewandan.online$request_uri;
}
