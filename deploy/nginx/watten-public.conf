# Managed Watten public beta.
server {
    listen 80;
    listen [::]:80;
    server_name watten.zockdiewandan.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        return 308 https://watten.zockdiewandan.online$request_uri;
    }
}

# Managed Watten public beta. Separate certificate, shared verified application upstream.
server {
    server_name watten.zockdiewandan.online;
    # Avatar sources are accepted by the application up to 8 MiB. Keep the
    # proxy boundary above that value so ordinary PNG/WebP photos can reach the
    # verified application limit instead of receiving an opaque Nginx 413.
    client_max_body_size 10m;

    # `add_header` is inherited only when the child context has no own
    # `add_header`.  Keep the complete set here together with the app-specific
    # CSP; otherwise the CSP would shadow the headers from conf.d/security.conf.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The dedicated Watten PWA uses the same origin-only microphone permission.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # In-game rules load in a same-origin iframe; Turnstile uses its own host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        limit_req zone=zdwa_http_per_ip burst=80 nodelay;
        proxy_pass http://rollthedice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # RealIP trusts only Cloudflare ranges. Overwrite incoming forwarding
        # headers; preserve the physical edge for the backend's country check.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-RTD-Cloudflare-Peer $realip_remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /ws/ {
        limit_conn zdwa_connections_per_ip 30;
        proxy_pass http://rollthedice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-RTD-Cloudflare-Peer $realip_remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/watten.zockdiewandan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watten.zockdiewandan.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

