# Managed Watten reservation. No application upstream before the public release.
server {
    listen 80;
    listen [::]:80;
    server_name watten.zockdiewandan.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 308 https://watten.zockdiewandan.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name watten.zockdiewandan.online;
    ssl_certificate /etc/letsencrypt/live/watten.zockdiewandan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watten.zockdiewandan.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # A closed host has no public sitemap, worker, manifest, API or WebSocket.
    # Keep robots readable while the actual responses independently say noindex.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        return 503 '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Watten wird vorbereitet / Watten is being prepared</title></head><body data-watten-reserved="true"><main><h1>Watten wird vorbereitet</h1><p>Watten ist noch nicht verfügbar.</p><section lang="en"><h2>Watten is being prepared</h2><p>Watten is not available yet.</p></section></main></body></html>';
    }
}
