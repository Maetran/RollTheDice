services:
  rollthedice:
    build: .
    container_name: rollthedice
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      ROLLTHEDICE_ADMIN_USERNAME: ${ROLLTHEDICE_ADMIN_USERNAME:-}
      ROLLTHEDICE_ADMIN_PASSWORD: ${ROLLTHEDICE_ADMIN_PASSWORD:-}
      ROLLTHEDICE_COOKIE_SECURE: ${ROLLTHEDICE_COOKIE_SECURE:-0}
      ROLLTHEDICE_COOKIE_DOMAIN: ${ROLLTHEDICE_COOKIE_DOMAIN:-}
      ROLLTHEDICE_SITE_ORIGIN: ${ROLLTHEDICE_SITE_ORIGIN:-https://zockdiewandan.online}
      ROLLTHEDICE_ZILCH_ORIGIN: ${ROLLTHEDICE_ZILCH_ORIGIN:-https://zilch.zockdiewandan.online}
      # Uvicorn only trusts forwarded client data from these direct peers.
      # Production uses the Docker bridge gateway; local runs stay loopback-only.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      ROLLTHEDICE_TURNSTILE_SITE_KEY: ${ROLLTHEDICE_TURNSTILE_SITE_KEY:-}
      ROLLTHEDICE_TURNSTILE_SECRET: ${ROLLTHEDICE_TURNSTILE_SECRET:-}
      ROLLTHEDICE_GAME_CREATE_BURST_MAX: ${ROLLTHEDICE_GAME_CREATE_BURST_MAX:-5}
      ROLLTHEDICE_GAME_CREATE_IP_MAX: ${ROLLTHEDICE_GAME_CREATE_IP_MAX:-30}
      ROLLTHEDICE_GAME_CREATE_GLOBAL_MAX: ${ROLLTHEDICE_GAME_CREATE_GLOBAL_MAX:-300}
      ROLLTHEDICE_MAX_WEBSOCKETS_PER_ADDRESS: ${ROLLTHEDICE_MAX_WEBSOCKETS_PER_ADDRESS:-30}
      ROLLTHEDICE_MAX_WEBSOCKETS_GLOBAL: ${ROLLTHEDICE_MAX_WEBSOCKETS_GLOBAL:-500}
      # Public Zilch admits guests and signed-in accounts. The allowlist is
      # retained only for an explicit fail-closed rollback to preview mode.
      ROLLTHEDICE_ZILCH_PREVIEW_USERNAMES: ${ROLLTHEDICE_ZILCH_PREVIEW_USERNAMES:-}
      ROLLTHEDICE_ZILCH_ACCESS_MODE: ${ROLLTHEDICE_ZILCH_ACCESS_MODE:-public}
      ROLLTHEDICE_ZILCH_CPU_DELAY_SECONDS: ${ROLLTHEDICE_ZILCH_CPU_DELAY_SECONDS:-0.9}

