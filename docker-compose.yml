services:
  rollthedice:
    build: .
    container_name: rollthedice
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      ROLLTHEDICE_ADMIN_USERNAME: ${ROLLTHEDICE_ADMIN_USERNAME:-}
      ROLLTHEDICE_ADMIN_PASSWORD: ${ROLLTHEDICE_ADMIN_PASSWORD:-}
      ROLLTHEDICE_COOKIE_SECURE: ${ROLLTHEDICE_COOKIE_SECURE:-0}
      ROLLTHEDICE_TURNSTILE_SITE_KEY: ${ROLLTHEDICE_TURNSTILE_SITE_KEY:-}
      ROLLTHEDICE_TURNSTILE_SECRET: ${ROLLTHEDICE_TURNSTILE_SECRET:-}
      ROLLTHEDICE_GAME_CREATE_BURST_MAX: ${ROLLTHEDICE_GAME_CREATE_BURST_MAX:-5}
      ROLLTHEDICE_GAME_CREATE_IP_MAX: ${ROLLTHEDICE_GAME_CREATE_IP_MAX:-30}
      ROLLTHEDICE_GAME_CREATE_GLOBAL_MAX: ${ROLLTHEDICE_GAME_CREATE_GLOBAL_MAX:-300}
      ROLLTHEDICE_MAX_WEBSOCKETS_PER_ADDRESS: ${ROLLTHEDICE_MAX_WEBSOCKETS_PER_ADDRESS:-30}
      ROLLTHEDICE_MAX_WEBSOCKETS_GLOBAL: ${ROLLTHEDICE_MAX_WEBSOCKETS_GLOBAL:-500}
      # Private Zilch-preview controls are deliberately operator-only.  The
      # empty default keeps the production-safe Mani-only policy intact.
      ROLLTHEDICE_ZILCH_PREVIEW_USERNAMES: ${ROLLTHEDICE_ZILCH_PREVIEW_USERNAMES:-}
      ROLLTHEDICE_ZILCH_CPU_DELAY_SECONDS: ${ROLLTHEDICE_ZILCH_CPU_DELAY_SECONDS:-0.55}

# git clone https://github.com/Maetran/RollTheDice.git
# cd RollTheDice
# docker compose up -d --build
