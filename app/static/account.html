<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Würfler – Mein Konto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v=82">
  <script src="/static/theme.js?v=1"></script>
</head>
<body class="lobby-page">
  <main class="wrap profile-shell">
    <nav class="page-nav"><a href="/">← Lobby</a><a id="publicProfileLink" href="#">Öffentliches Profil</a></nav>
    <section class="card">
      <p class="eyebrow">Mein Konto</p>
      <h1 id="accountName">Benutzerkonto</h1>
      <div id="accountNotice" class="connection-error" hidden></div>
      <h2>Statistiken</h2>
      <div id="statistics" class="statistics-grid"></div>
    </section>
    <section class="card password-card">
      <h2>Spieleinstellungen</h2>
      <p class="muted small">Diese Einstellungen gelten für dein Konto auf allen Geräten.</p>
      <form id="preferencesForm" class="form-stack account-preferences-form">
        <fieldset>
          <legend>Ansage auswählen</legend>
          <label><input type="radio" name="announceSelectionMode" value="overlay"> Auswahlfenster mit allen Ansagefeldern</label>
          <label><input type="radio" name="announceSelectionMode" value="table"> Freies ❗-Feld direkt in der Tabelle anklicken</label>
        </fieldset>
        <fieldset>
          <legend>Angesagtes Feld schreiben</legend>
          <label><input type="radio" name="autoWriteAnnounced" value="true"> Nach dem letzten Wurf automatisch schreiben</label>
          <label><input type="radio" name="autoWriteAnnounced" value="false"> Immer manuell schreiben</label>
        </fieldset>
        <button>Spieleinstellungen speichern</button>
      </form>
      <div id="preferencesMessage" class="muted small" role="status"></div>
    </section>
    <section class="card password-card">
      <h2>Passwort ändern</h2>
      <p id="passwordHint" class="muted small"></p>
      <form id="passwordForm" class="form-stack">
        <label>Aktuelles Passwort<input id="currentPassword" type="password" autocomplete="current-password" required></label>
        <label>Neues Passwort<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Neues Passwort wiederholen<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button>Passwort ändern</button>
      </form>
      <div id="passwordMessage" class="muted small"></div>
    </section>
  </main>
  <script type="module">
    import { apiFetch, authError, escapeHtml, formatNumber, loadAuth } from '/static/auth.js?v=2';
    const auth = await loadAuth();
    if (!auth.authenticated) location.replace('/');
    const user = auth.user;
    document.getElementById('accountName').textContent = user.username;
    document.getElementById('publicProfileLink').href = `/static/profile.html?user=${encodeURIComponent(user.username)}`;
    if (user.must_change_password) {
      document.getElementById('passwordHint').textContent = 'Das temporäre Passwort muss jetzt geändert werden.';
    }

    const preferences = user.preferences || {};
    const announceMode = preferences.announce_selection_mode === 'table' ? 'table' : 'overlay';
    const autoWrite = preferences.auto_write_announced !== false;
    document.querySelector(`input[name="announceSelectionMode"][value="${announceMode}"]`).checked = true;
    document.querySelector(`input[name="autoWriteAnnounced"][value="${autoWrite}"]`).checked = true;

    document.getElementById('preferencesForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('preferencesMessage');
      const selectedMode = document.querySelector('input[name="announceSelectionMode"]:checked')?.value;
      const selectedAutoWrite = document.querySelector('input[name="autoWriteAnnounced"]:checked')?.value;
      const response = await apiFetch('/api/auth/preferences', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          announce_selection_mode: selectedMode,
          auto_write_announced: selectedAutoWrite === 'true',
        }),
      });
      const data = await response.json().catch(() => ({}));
      message.textContent = response.ok
        ? 'Spieleinstellungen gespeichert.'
        : authError(data.detail);
    });

    function bucket(title, data, { details = true } = {}) {
      const trend = data.trend === 'up'
        ? { symbol: '↑', text: 'Positiv', css: 'avg-up' }
        : data.trend === 'down'
          ? { symbol: '↓', text: 'Negativ', css: 'avg-down' }
          : { symbol: '–', text: 'Stagnierend', css: 'avg-same' };
      const trendTitle = data.trend_games < 3
        ? `Noch keine drei ${title}-Spiele vorhanden`
        : `Ø der letzten 3 Spiele: ${formatNumber(data.recent_average_points)}`;
      return `<article class="stat-bucket"><h2>${escapeHtml(title)}</h2><dl>
        <div><dt>Spiele</dt><dd>${formatNumber(data.games_played, '0')}</dd></div>
        <div><dt>Gesamtpunkte</dt><dd>${formatNumber(data.points_total, '0')}</dd></div>
        ${details ? `<div><dt>Maximum</dt><dd>${formatNumber(data.max_points)}</dd></div>
        <div><dt>Minimum</dt><dd>${formatNumber(data.min_points)}</dd></div>
        <div><dt>Durchschnitt</dt><dd>${formatNumber(data.average_points)}</dd></div>
        <div><dt>Trend (3 Spiele)</dt><dd><span class="avg-trend ${trend.css}" title="${escapeHtml(trendTitle)}" aria-label="${escapeHtml(trendTitle)}">${trend.symbol} ${trend.text}</span></dd></div>` : ''}
      </dl></article>`;
    }

    const statsResponse = await fetch('/api/users/me/statistics', { cache: 'no-store' });
    if (statsResponse.ok) {
      const stats = (await statsResponse.json()).player.statistics;
      document.getElementById('statistics').innerHTML = bucket('Gesamt', stats.overall, { details: false })
        + bucket('Normal', stats.normal) + bucket('Hardcore', stats.hardcore);
    }

    document.getElementById('passwordForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('passwordMessage');
      const current = document.getElementById('currentPassword').value;
      const next = document.getElementById('newPassword').value;
      if (next !== document.getElementById('confirmPassword').value) {
        message.textContent = 'Die neuen Passwörter stimmen nicht überein.';
        return;
      }
      const response = await apiFetch('/api/auth/change-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: current, new_password: next }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) { message.textContent = authError(data.detail); return; }
      message.textContent = 'Passwort geändert. Bitte erneut anmelden.';
      setTimeout(() => location.replace('/'), 1200);
    });
  </script>
</body>
</html>
