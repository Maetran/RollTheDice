<!doctype html>
<html lang="de" data-game="watten" data-watten-page="{watten_page}" data-game-id="{game_id}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Watten zu zweit, zu dritt oder zu viert: eigene Tische, feste Teams, Ansagen, Bieten und Pausen mit deinem Spielerkonto.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">

<body class="wt-body">
