<!doctype html>
<html lang="de" data-game="watten" data-watten-page="{watten_page}" data-game-id="{game_id}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Watten zu zweit, zu dritt oder zu viert: eigene Tische, feste Teams, Ansagen, Bieten und Pausen mit deinem Spielerkonto.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light">
  <title>Watten</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/watten/icons/watten-icon-32.png?v=fbab260d78c7">
  <script>{let d="classic";try{if(localStorage.getItem("watten_design")==="tirol")d="tirol"}catch(_){}document.documentElement.dataset.wattenDesign=d}</script>
  <link rel="stylesheet" href="/static/watten-game.css?v=fbab260d78c7">
  <link rel="stylesheet" href="/static/suite-header.css?v=fbab260d78c7">
  <link rel="stylesheet" href="/static/watten-design.css?v=fbab260d78c7">
</head>
<body class="wt-body">
  <a class="wt-skip" href="#wattenApp">Zum Inhalt / Skip to content</a>
  <header class="wt-header suite-header">
    <a class="wt-brand suite-header__brand" href="/watten" translate="no"><img class="suite-header__icon" src="/static/watten/icons/watten-icon-32.png?v=fbab260d78c7" width="32" height="32" alt=""><span>Watten</span></a>
    <div class="suite-header__tools">
      <label class="wt-language"><span class="wt-visually-hidden">Sprache / Language</span><select data-language-switcher aria-label="Sprache / Language"><option value="de">DE</option><option value="en">EN</option></select></label>
      <button type="button" class="wt-design-toggle" data-theme-toggle data-watten-design-toggle aria-label="Darstellung wechseln: Klassisch. Nächste Darstellung: Tirol." title="Darstellung wechseln: Klassisch. Nächste Darstellung: Tirol."><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="m12 8 3 4-3 4-3-4z"/></svg></button>
      <button id="wattenSuitePicker" type="button" class="game-switch" data-game-switch hidden disabled aria-label="Spiele / Games"></button>
    </div>
    <nav class="wt-nav suite-header__nav" data-watten-nav aria-label="Watten">
      <a href="/watten">Lobby</a>
      <a href="/watten/rangliste">Spieler &amp; Ranking</a>
      <a href="/watten/regeln">Regeln</a>
      <a href="/watten/konto/fortschritt" data-watten-account-link>Konto</a>
    </nav>
  </header>
  <main id="wattenApp" class="wt-main" tabindex="-1">
    <h1 translate="no">Watten</h1>
    <p>Für Watten brauchst du JavaScript.</p>
    <p lang="en">Watten needs JavaScript.</p>
  </main>
  <script type="module" src="/static/watten-game.js?v=fbab260d78c7"></script>
</body>
</html>
