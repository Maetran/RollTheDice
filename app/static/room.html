<!DOCTYPE html>
<html lang="de" data-game="zdwa">
<head>
  <meta charset="utf-8" />
  <title>ZDWA – Spiel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Aktiver ZDWA Spielraum für Spieler und Zuschauer.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest?v=ae75eda60b02">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=ae75eda60b02" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png?v=ae75eda60b02" sizes="180x180">
  <!--
    room.html – Spielraum
    ---------------------
    Diese Seite stellt den Spielraum bereit:
    - Styles aus /static/style.css bestimmen Grundlayout (Kartenbreiten, Farben)
    - scoreboard.js rendert die Spielinhalte (Dicebar, Tabellen, Vorschläge)
    - room.js verbindet per WebSocket, orchestriert UI, Chat und Korrekturmodus
    - Ein schlanker Header bietet Reactions, Regeln-Link und Zurück-zur-Lobby
  -->
  <script>try{const t=localStorage.getItem("wuerfler_theme");const d=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=d;document.documentElement.style.colorScheme=d}catch(_){}</script>
  <script src="/static/shell.js?v=ae75eda60b02" defer></script>
  <link rel="stylesheet" href="/static/style.css?v=ae75eda60b02">
</head>
<body class="room-page">
  <h1 class="visually-hidden">ZDWA Spielraum</h1>
  <!-- Header: Zugstatus plus direkte Spielaktionen; sekundäre Aktionen im Menü. -->
  <div class="room-header">
    <div id="reactionsBar" class="reactions-host"></div>
    <div id="headerTurnStatus" class="header-turn-status" aria-live="polite"></div>
    <div class="spacer"></div>
    <button class="small ghost game-switch room-game-switch" type="button" data-game-switch hidden disabled aria-hidden="true" aria-label="Zilch öffnen (Alt+Shift+Z)" aria-keyshortcuts="Alt+Shift+Z" title="Zilch öffnen (Alt+Shift+Z)"><span class="game-switch-icon game-switch-icon--zilch" aria-hidden="true">Z</span><span class="room-game-switch-label">Zilch</span></button>
    <div class="room-header-overflow">
      <button id="roomHeaderMenuToggle" class="small ghost room-header-menu-toggle" type="button" aria-haspopup="menu" aria-controls="roomHeaderMenuPanel" aria-expanded="false" aria-label="Weitere Aktionen" title="Weitere Aktionen"><span aria-hidden="true">⋯</span></button>
      <div id="roomHeaderMenuPanel" class="room-header-menu-panel" role="menu" aria-label="Weitere Aktionen" hidden>
        <button class="small ghost theme-toggle theme-toggle-compact" type="button" role="menuitem" data-theme-toggle aria-pressed="false" aria-label="Dunklen Modus einschalten"><span class="theme-toggle-icon" data-theme-icon aria-hidden="true">☾</span><span class="room-header-menu-label">Darstellung</span></button>
        <button id="rulesSheetOpen" class="small ghost" type="button" role="menuitem"><span aria-hidden="true">?</span><span>Spielregeln</span></button>
        <button id="rankLegendSheetOpen" class="small ghost rank-legend-trigger" type="button" role="menuitem" aria-controls="rankLegendSheet" aria-expanded="false" aria-label="Ränge" title="Ränge"><span aria-hidden="true">⭐</span><span>Ränge</span></button>
        <button id="shareGameBtn" class="small ghost room-share-button" type="button" role="menuitem" aria-label="Spiel teilen" title="Spiel teilen"><span aria-hidden="true">↗</span><span>Spiel teilen</span></button>
      </div>
    </div>
    <button id="backToLobbyBtn" class="small danger ghost leave-game-trigger" type="button" aria-label="Spiel verlassen" title="Spiel verlassen"><span class="room-header-action-label">Spiel verlassen</span></button>
  </div>
  <div id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden></div>

  <!-- Scoreboard-Mount: Würfel, Buttons, Tabellen werden hier gerendert (scoreboard.js) -->
  <div id="scoreOut"></div>

  <!-- Spielregeln als In-Game-Sheet, damit der Spielraum aktiv bleibt -->
  <div id="rulesSheetBackdrop" class="rules-sheet-backdrop" hidden></div>
  <section id="rulesSheet" class="rules-sheet" role="dialog" aria-modal="true" aria-labelledby="rulesSheetTitle" tabindex="-1" hidden>
    <div class="rules-sheet-head">
      <h2 id="rulesSheetTitle">Spielregeln</h2>
      <button id="rulesSheetClose" class="small ghost rules-sheet-close" type="button" aria-label="Spielregeln schließen">×</button>
    </div>
    <iframe id="rulesFrame" class="rules-frame" title="Spielregeln" data-src="/regeln?embed=1" scrolling="yes"></iframe>
  </section>

  <div id="leaveGameBackdrop" class="leave-game-backdrop" hidden></div>
  <section id="leaveGameDialog" class="leave-game-dialog" role="dialog" aria-modal="true" aria-labelledby="leaveGameTitle" tabindex="-1" hidden>
    <h2 id="leaveGameTitle">Zur Lobby wechseln?</h2>
    <p id="leaveGameText" class="muted small"></p>
    <div class="leave-game-actions">
      <button id="leavePauseBtn" class="primary" type="button">Pause</button>
      <button id="leaveAbortBtn" class="danger" type="button">Zur Lobby</button>
      <button id="leaveStayBtn" class="ghost" type="button">Im Spiel bleiben</button>
    </div>
  </section>

  <!-- Chat-Bereich: Eingabe und Verlauf (durch room.js verdrahtet) -->
  <div id="chatBackdrop" class="chat-backdrop" hidden></div>
  <div id="chatReactionsBar" class="chat-reactions-host" aria-label="Reaktionen"></div>
  <div id="chatPanel" class="chat-panel">
    <button id="chatToggle" class="chat-toggle" type="button" aria-expanded="false" aria-controls="chatContent">
      <span>Chat</span>
      <span id="chatToggleCount" class="chat-toggle-count" hidden>0</span>
      <span class="chat-toggle-icon" aria-hidden="true">⌃</span>
    </button>
    <div id="chatContent" class="chat-content">
      <div class="chat-head">
        <h3>Chat</h3>
        <button id="chatClose" class="small ghost chat-close" type="button" aria-label="Chat schließen">×</button>
      </div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Nachricht eingeben …">
        <button id="chatSend" class="secondary">Senden</button>
      </div>
      <div id="chatBox" class="chat-box"></div>
    </div>
  </div>

  <!-- Scripts: zuerst scoreboard (Renderer), dann room (WS/Steuerung als ES-Modul) -->
  <script src="/static/scoreboard.js?v=ae75eda60b02" defer></script>
  <script src="/static/emoji.js?v=ae75eda60b02"></script>
  <script type="module" src="/static/room.js?v=ae75eda60b02"></script>
</body>
</html>
