<!doctype html>
<html lang="de" data-game="watten" data-watten-page="{watten_page}" data-game-id="{game_id}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Watten zu zweit, zu dritt oder zu viert: eigene Tische, feste Teams, Ansagen, Bieten und Pausen mit deinem Spielerkonto.">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light">
  <title>Watten online [BETA] – zu zweit, zu dritt oder zu viert</title>
  <link rel="canonical" href="https://watten.zockdiewandan.online/watten">
  <meta property="og:title" content="Watten online [BETA] – zu zweit, zu dritt oder zu viert">
  <meta property="og:description" content="Watten online: unsere Hausregeln, eigene Tische, Teams und Computergegner. Öffentliche Beta.">
  <meta property="og:url" content="https://watten.zockdiewandan.online/watten">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/watten/icons/watten-icon-32.png?v=f7b1f4b7c437">
  <link rel="stylesheet" href="/static/watten-game.css?v=f7b1f4b7c437">
  <link rel="stylesheet" href="/static/suite-header.css?v=f7b1f4b7c437">
</head>
<body class="wt-body">
  <a class="wt-skip" href="#wattenApp">Zum Inhalt / Skip to content</a>
  <header class="wt-header suite-header">
    <a class="wt-brand suite-header__brand" href="/watten" translate="no"><img class="suite-header__icon" src="/static/watten/icons/watten-icon-32.png?v=f7b1f4b7c437" width="32" height="32" alt=""><span>Watten</span></a>
    <div class="suite-header__tools">
      <label class="wt-language"><span class="wt-visually-hidden">Sprache / Language</span><select data-language-switcher aria-label="Sprache / Language"><option value="de">DE</option><option value="en">EN</option></select></label>
      <button id="wattenSuitePicker" type="button" class="game-switch" data-game-switch hidden disabled aria-label="Spiele / Games"></button>
    </div>
    <nav class="wt-nav suite-header__nav" data-watten-nav aria-label="Watten">
      <a href="/watten">Lobby</a>
      <a href="/watten/rangliste">Spieler &amp; Ranking</a>
      <a href="/watten/regeln">Regeln</a>
      <a href="/watten/konto/einstellungen">Konto</a>
    </nav>
  </header>
  <main id="wattenApp" class="wt-main" tabindex="-1">
    <h1>{watten_public_heading}</h1>
    <p class="wt-lead">{watten_public_intro}</p>
    <p>{watten_public_detail}</p>
    <p>{watten_public_beta}</p>
    <p><a class="wt-button" href="/watten/anmelden">{watten_public_play}</a> · <a href="/watten/regeln">{watten_public_rules}</a></p>
    <nav aria-label="{watten_public_language}"><a href="/watten" lang="de" hreflang="de">Deutsch</a> · <a href="/watten?lang=en" lang="en" hreflang="en">English</a></nav>
  </main>
  <script type="module" src="/static/watten-game.js?v=f7b1f4b7c437"></script>
</body>
</html>
