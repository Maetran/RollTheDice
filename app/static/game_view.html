<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZDWA – Spielansicht</title>
  <meta name="theme-color" content="#f4f6f8">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest?v=da6daff971a7">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=da6daff971a7" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png?v=da6daff971a7" sizes="180x180">
  <script src="/static/i18n.js?v=da6daff971a7"></script>
  <script src="/static/ui.js?v=da6daff971a7"></script>
  <script src="/static/pwa.js?v=da6daff971a7" defer></script>
  <script src="/static/theme.js?v=da6daff971a7"></script>
  <link rel="stylesheet" href="/static/style.css?v=da6daff971a7" />
  <style>
    .container { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    header.top { padding: .75rem 1rem; border-bottom: 1px solid var(--border); display:flex; gap:.5rem; align-items:center; justify-content:space-between; }
    header.top h1 { margin: 0; font-size: 1.25rem; }
    .back-btn { margin-left:auto; }
  </style>
</head>
<body>
  <header class="top">
    <h1 id="roomGameName">Spielansicht</h1>
    <button class="small ghost theme-toggle theme-toggle-compact" type="button" data-theme-toggle aria-pressed="false" aria-label="Dunklen Modus einschalten">
      <span class="theme-toggle-icon" data-theme-icon aria-hidden="true">☾</span>
      <span class="theme-toggle-label" data-theme-label>Dunkel</span>
    </button>
    <button class="small back-btn" onclick="location.href='/'">⬅️ Zurück zur Lobby</button>
  </header>

  <main class="container">
    <div id="contentMount" class="content"></div>
  </main>

  <!-- Scoreboard-Renderer -->
  <script src="/static/scoreboard.js?v=da6daff971a7"></script>
  <script>
  (function(){
    function qs(name){ return new URLSearchParams(location.search).get(name); }
    var resultPath = location.pathname.match(/^\/ergebnis\/([^/]+)\/?$/);
    var gameId = qs("id") || "";
    try { if (resultPath) gameId = decodeURIComponent(resultPath[1]); }
    catch(e) { gameId = ""; }
    if (gameId && !resultPath) history.replaceState(null, "", "/ergebnis/" + encodeURIComponent(gameId));
    var mount = document.getElementById("contentMount");
    var titleEl = document.getElementById("roomGameName");

    function setStatus(msg){
      if (mount) {
        mount.innerHTML = "<div class='muted view-status'>" + msg + "</div>";
      }
    }

    if (!gameId){
      setStatus("Kein Spiel angegeben.");
      return;
    }

    function fmt(dtStr){
      try {
        var d = new Date(dtStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString(window.ZDWA_I18N?.locale?.() || 'de-CH');
      } catch(e){ return ""; }
    }

    function ensureRendererLoaded(){
      return new Promise(function(resolve, reject){
        if (window.renderReadOnlyFromLeaderboard) {
          return resolve();
        }
        setStatus("Lade Renderer …");
        var s = document.createElement("script");
        s.src = "/static/scoreboard.js?v=" + Date.now();
        s.onload = function(){
          if (window.renderReadOnlyFromLeaderboard) resolve();
          else reject(new Error("renderer_missing"));
        };
        s.onerror = function(){ reject(new Error("renderer_load_error")); };
        document.head.appendChild(s);
      });
    }

    fetch("/api/game_from_leaderboard/" + encodeURIComponent(gameId))
      .then(function(res){
        if (!res.ok) throw new Error("not_found");
        return res.json();
      })
      .then(function(data){
        if (titleEl){
          var when = data.finished_at ? fmt(data.finished_at) : "";
          titleEl.textContent = (data.gamename || "Spiel") + (when ? (" — " + when) : "");
        }
        return ensureRendererLoaded().then(function(){
          window.renderReadOnlyFromLeaderboard(mount, data);
        });
      })
      .catch(function(err){
        if (String(err && err.message) === "not_found") {
          setStatus("Spiel nicht gefunden oder ohne Snapshot.");
        } else if (String(err && err.message).indexOf("renderer_") === 0) {
          setStatus("Renderer konnte nicht geladen werden.");
        } else {
          setStatus("Fehler beim Laden.");
        }
      });
  })();
  </script>
</body>
</html>
