<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZDWA – Spielansicht</title>
  <meta name="theme-color" content="#f4f6f8">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest?v=82453ff0615a">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=82453ff0615a" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png?v=82453ff0615a" sizes="180x180">
  <script src="/static/i18n.js?v=82453ff0615a"></script>
  <script src="/static/ui.js?v=82453ff0615a"></script>
  <script src="/static/pwa.js?v=82453ff0615a" defer></script>
  <script src="/static/theme.js?v=82453ff0615a"></script>
  <link rel="stylesheet" href="/static/style.css?v=82453ff0615a" />
  <style>
    .container { width:min(1120px, calc(100vw - 32px)); margin:1.25rem auto 2rem; }
    .result-title { margin: 0 0 1rem; font-size: 1.25rem; }
    @media (max-width:560px) { .container { width:100%; margin:.75rem auto 1.25rem; padding:0 .75rem; } }
  </style>
</head>
<body class="lobby-page">
  <main class="container">
    <header class="app-nav">
      <a class="app-nav-brand" href="/" aria-label="ZDWA Lobby"><span class="logo" aria-hidden="true">🎲</span><span>ZDWA</span></a>
      <nav class="app-nav-links" aria-label="Hauptnavigation">
        <a class="app-nav-link" href="/">Lobby</a><a class="app-nav-link" href="/spieler">Spieler &amp; Ranking</a><a class="app-nav-link" href="/regeln">Regeln</a><a class="app-nav-link" href="/konto">Konto</a>
      </nav>
      <div class="app-nav-tools"><button class="small ghost theme-toggle theme-toggle-compact" type="button" data-theme-toggle aria-pressed="false" aria-label="Dunklen Modus einschalten"><span class="theme-toggle-icon" data-theme-icon aria-hidden="true">☾</span><span class="theme-toggle-label" data-theme-label>Dunkel</span></button></div>
    </header>
    <h1 id="roomGameName" class="result-title">Spielansicht</h1>
    <div id="contentMount" class="content"></div>
  </main>

  <!-- Scoreboard-Renderer -->
  <script src="/static/scoreboard.js?v=82453ff0615a"></script>
  <script>
  (function(){
    function qs(name){ return new URLSearchParams(location.search).get(name); }
    var resultPath = location.pathname.match(/^\/ergebnis\/([^/]+)\/?$/);
    var gameId = qs("id") || "";
    try { if (resultPath) gameId = decodeURIComponent(resultPath[1]); }
    catch(e) { gameId = ""; }
    if (gameId && !resultPath) history.replaceState(null, "", "/ergebnis/" + encodeURIComponent(gameId));
    var mount = document.getElementById("contentMount");
    var titleEl = document.getElementById("roomGameName");

    function setStatus(msg){
      if (mount) {
        mount.innerHTML = "<div class='muted view-status'>" + msg + "</div>";
      }
    }

    if (!gameId){
      setStatus("Kein Spiel angegeben.");
      return;
    }

    function fmt(dtStr){
      try {
        var d = new Date(dtStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString(window.ZDWA_I18N?.locale?.() || 'de-CH');
      } catch(e){ return ""; }
    }

    function ensureRendererLoaded(){
      return new Promise(function(resolve, reject){
        if (window.renderReadOnlyFromLeaderboard) {
          return resolve();
        }
        setStatus("Lade Renderer …");
        var s = document.createElement("script");
        s.src = "/static/scoreboard.js?v=" + Date.now();
        s.onload = function(){
          if (window.renderReadOnlyFromLeaderboard) resolve();
          else reject(new Error("renderer_missing"));
        };
        s.onerror = function(){ reject(new Error("renderer_load_error")); };
        document.head.appendChild(s);
      });
    }

    fetch("/api/game_from_leaderboard/" + encodeURIComponent(gameId))
      .then(function(res){
        if (!res.ok) throw new Error("not_found");
        return res.json();
      })
      .then(function(data){
        if (titleEl){
          var when = data.finished_at ? fmt(data.finished_at) : "";
          titleEl.textContent = (data.gamename || "Spiel") + (when ? (" — " + when) : "");
        }
        return ensureRendererLoaded().then(function(){
          window.renderReadOnlyFromLeaderboard(mount, data);
        });
      })
      .catch(function(err){
        if (String(err && err.message) === "not_found") {
          setStatus("Spiel nicht gefunden oder ohne Snapshot.");
        } else if (String(err && err.message).indexOf("renderer_") === 0) {
          setStatus("Renderer konnte nicht geladen werden.");
        } else {
          setStatus("Fehler beim Laden.");
        }
      });
  })();
  </script>
</body>
</html>
