<!doctype html>
<html lang="de" data-game="watten" data-watten-progress-page="{watten_progress_page}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Deine Watten-Erfolge, gespielten Partien und Ranglisten.">
  <meta name="referrer" content="same-origin">
  <title>Watten</title>
  <script>{let d="classic";try{if(localStorage.getItem("watten_design")==="tirol")d="tirol"}catch(_){}document.documentElement.dataset.wattenDesign=d}</script>
  <link rel="stylesheet" href="/static/watten-game.css?v=56d3f008cceb">
  <link rel="stylesheet" href="/static/suite-header.css?v=56d3f008cceb">
  <link rel="stylesheet" href="/static/watten-design.css?v=56d3f008cceb">
</head>
<body>
  <a class="wt-skip" href="#wattenProgress">Zum Inhalt / Skip to content</a>
  <header class="wt-header suite-header">
    <a class="wt-brand suite-header__brand" href="/watten" translate="no"><img class="suite-header__icon" src="/static/watten/icons/watten-icon-32.png?v=56d3f008cceb" width="32" height="32" alt=""><span>Watten</span></a>
    <div class="suite-header__tools">
      <label class="wt-language"><span class="wt-visually-hidden">Sprache / Language</span><select data-language-switcher aria-label="Sprache / Language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
      <button type="button" class="wt-design-toggle" data-theme-toggle data-watten-design-toggle aria-label="Darstellung wechseln: Klassisch. Nächste Darstellung: Tirol." title="Darstellung wechseln: Klassisch. Nächste Darstellung: Tirol."><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="m12 8 3 4-3 4-3-4z"/></svg></button>
      <button id="wattenSuitePicker" type="button" class="game-switch" data-game-switch hidden disabled aria-label="Spiele / Games"></button>
    </div>
    <nav class="wt-nav suite-header__nav" data-watten-progress-nav aria-label="Watten">
      <a href="/watten">Lobby</a>
      <a href="/watten/rangliste" data-watten-ranking-link>Spieler &amp; Ranking</a>
      <a href="/watten/regeln">Regeln</a>
      <a href="/watten/konto/einstellungen" data-watten-account-link>Konto</a>
    </nav>
  </header>
  <main id="wattenProgress" class="wt-main" tabindex="-1">
    <h1 translate="no">Watten</h1><p>JavaScript wird benötigt. / JavaScript is required.</p>
  </main>
  <script type="module" src="/static/watten-progress.js?v=56d3f008cceb"></script>
</body>
</html>
