<!doctype html>
<html lang="de" data-game="zilch">
<head>
  <meta charset="utf-8">
  <title>Zilch-Vorschau – intern</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Geschützte interne Vorschau des separaten Zilch-Spielmodus mit sechs Würfeln und einem Ziel von 10’000 Punkten.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest?v=e3378687721c">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=e3378687721c" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png?v=e3378687721c" sizes="180x180">
  <script>try{const t=localStorage.getItem("wuerfler_theme");const d=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=d;document.documentElement.style.colorScheme=d}catch(_){}</script>
  <script src="/static/shell.js?v=e3378687721c" defer></script>
  <link rel="stylesheet" href="/static/zilch.css?v=e3378687721c">
</head>
<body class="zilch-page">
  <main class="zilch-shell zilch-loading" data-zilch-root aria-live="polite">
    <header class="zilch-header">
      <a class="zilch-brand" href="/" aria-label="ZDWA Lobby"><span class="zilch-brand-mark" aria-hidden="true">Z</span><span>Zilch</span></a>
      <div class="zilch-header-tools">
        <span id="zilchAccount"></span>
        <label class="language-switcher" aria-label="Sprache wählen"><select data-language-switcher aria-label="Sprache wählen"><option value="de">DE</option><option value="en">EN</option></select></label>
        <button class="small ghost theme-toggle theme-toggle-compact" type="button" data-theme-toggle aria-pressed="false" aria-label="Dunklen Modus einschalten"><span data-theme-icon aria-hidden="true">☾</span></button>
        <button class="small ghost game-switch" type="button" data-game-switch hidden disabled aria-hidden="true" aria-keyshortcuts="Alt+Shift+Z" title="ZDWA öffnen (Alt+Shift+Z)"><span aria-hidden="true">⇄</span><span>ZDWA</span></button>
        <button id="zilchLogout" class="small ghost" type="button">Abmelden</button>
      </div>
    </header>
    <div id="zilchContent"><h1>Zilch-Vorschau wird geprüft …</h1></div>
  </main>
  <script type="module" src="/static/zilch.js?v=e3378687721c"></script>
</body>
</html>
