<!doctype html>
<html lang="de" data-game="zdwa">
<head>
  <meta charset="utf-8">
  <title>ZDWA – Spielerprofil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Öffentliches ZDWA Spielerprofil mit Statistiken und letzten Spielen.">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="/manifest.webmanifest?v=1958fa20da92">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=1958fa20da92" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png?v=1958fa20da92" sizes="180x180">
  <script>try{const t=localStorage.getItem("wuerfler_theme");const d=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=d;document.documentElement.style.colorScheme=d}catch(_){}</script>
  <link rel="stylesheet" href="/static/style.css?v=1958fa20da92">
  <script src="/static/shell.js?v=1958fa20da92" defer></script>
</head>
<body class="lobby-page">
  <main class="wrap profile-shell">
    <header class="app-nav">
      <a class="app-nav-brand" href="/" aria-label="ZDWA Lobby"><span class="logo" aria-hidden="true">🎲</span><span>ZDWA</span></a>
      <nav class="app-nav-links" aria-label="Hauptnavigation">
        <a class="app-nav-link" href="/">Lobby</a><a class="app-nav-link" href="/spieler" aria-current="page">Spieler &amp; Ranking</a><a class="app-nav-link" href="/regeln">Regeln</a><a class="app-nav-link" href="/konto">Konto</a>
      </nav>
      <div class="app-nav-tools"><button class="small ghost theme-toggle theme-toggle-compact" type="button" data-theme-toggle aria-pressed="false" aria-label="Dunklen Modus einschalten"><span class="theme-toggle-icon" data-theme-icon aria-hidden="true">☾</span></button><button class="small ghost game-switch" type="button" data-game-switch hidden disabled aria-hidden="true" aria-label="Zilch öffnen (Alt+Shift+Z)" aria-keyshortcuts="Alt+Shift+Z" title="Zilch öffnen (Alt+Shift+Z)"><span class="game-switch-icon game-switch-icon--zilch" aria-hidden="true">Z</span><span>Zilch</span></button></div>
    </header>
    <section class="card">
      <p class="eyebrow">Öffentliches Spielerprofil</p>
      <h1 id="profileName">Spielerprofil</h1>
      <div id="profileError" class="connection-error" hidden></div>
      <div id="statistics" class="statistics-grid"></div>
      <section class="achievements-section" aria-labelledby="achievementsTitle">
        <div class="section-title-row"><div><p class="eyebrow">Sammlung</p><h2 id="achievementsTitle">Erfolge</h2></div><p id="achievementSummary" class="muted small"></p></div>
        <section class="achievement-group" aria-labelledby="unlockedAchievementsTitle">
          <h3 id="unlockedAchievementsTitle">Erreicht</h3>
          <div id="unlockedAchievements" class="achievement-grid"></div>
        </section>
        <section class="achievement-group achievement-group-locked" aria-labelledby="lockedAchievementsTitle">
          <h3 id="lockedAchievementsTitle">Noch zu erreichen</h3>
          <div id="lockedAchievements" class="achievement-grid"></div>
        </section>
      </section>
      <section id="recentGamesSection" class="recent-games-section" hidden>
        <h2>Letzte Spiele</h2>
        <div id="recentGames" class="recent-games-list"></div>
      </section>
    </section>
  </main>
  <script type="module">
    import { escapeHtml, formatNumber, playerNameMarkup, playerRankBadge } from '/static/auth.js?v=1958fa20da92';
    const profilePath = location.pathname.match(/^\/spieler\/([^/]+)\/?$/);
    let username = new URLSearchParams(location.search).get('user') || '';
    try { if (profilePath) username = decodeURIComponent(profilePath[1]); }
    catch { username = ''; }
    if (username && !profilePath) history.replaceState(null, '', `/spieler/${encodeURIComponent(username)}`);
    const errorEl = document.getElementById('profileError');
    const statisticsEl = document.getElementById('statistics');
    document.title = username ? `ZDWA – ${username}` : document.title;

    function bucket(title, data, { details = true } = {}) {
      const t = window.ZDWA_I18N?.t || (value => value);
      const hasTrend = data.trend === 'up' || data.trend === 'down' || data.trend === 'same';
      const trend = data.trend === 'up'
        ? { symbol: '↑', text: 'Positiv', css: 'avg-up' }
        : data.trend === 'down'
          ? { symbol: '↓', text: 'Negativ', css: 'avg-down' }
          : hasTrend
            ? { symbol: '–', text: 'Stagnierend', css: 'avg-same' }
            : { symbol: '–', text: 'Zu wenig Daten', css: 'avg-same' };
      const trendTitle = !hasTrend
        ? `Zu wenig Daten: mindestens drei ${title}-Spiele erforderlich`
        : `Ø der letzten 3 Spiele: ${formatNumber(data.recent_average_points)}`;
      return `<article class="stat-bucket">
        <h2>${escapeHtml(title)}</h2>
        <dl>
          <div><dt>Spiele</dt><dd>${formatNumber(data.games_played, '0')}</dd></div>
        <div><dt>Gesamtpunkte</dt><dd>${formatNumber(data.points_total, '0')}</dd></div>
        ${data.achievement_points !== undefined ? `<div><dt>${t('Ehrenberg-Marken')}</dt><dd>${formatNumber(data.achievement_points, '0')} / ${formatNumber(data.achievement_points_possible, '0')}</dd></div>` : ''}
        ${data.achievement_rank ? `<div><dt>Rang</dt><dd>${playerRankBadge({ achievement_rank: data.achievement_rank })}</dd></div>` : ''}
          ${details ? `<div><dt>Maximum</dt><dd>${formatNumber(data.max_points)}</dd></div>
          <div><dt>Minimum</dt><dd>${formatNumber(data.min_points)}</dd></div>
          <div><dt>Durchschnitt</dt><dd>${formatNumber(data.average_points)}</dd></div>
          <div><dt>Median</dt><dd>${formatNumber(data.median_points)}</dd></div>
          <div><dt>Trend (3 Spiele)</dt><dd><span class="avg-trend ${trend.css}" title="${escapeHtml(trendTitle)}" aria-label="${escapeHtml(trendTitle)}">${trend.symbol} ${trend.text}</span></dd></div>` : ''}
        </dl>
      </article>`;
    }

    function achievementIcon(iconKey) {
      const icons = { points: '◆', games: '▦', score: '★', upper: '↑', row: '≡', strike: '×', sixty: '6', full: '●', poker: '♠', diff: 'Δ', kenter: '◇', bonus: '+', office: '◫', night: '☾', weekend: '☀', early: '↗', statistics: '⌁', account: '✓' };
      return icons[iconKey] || '✦';
    }

    function achievementDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat(window.ZDWA_I18N?.locale?.() || 'de-CH', {
        day: '2-digit', month: '2-digit', year: 'numeric',
      }).format(date);
    }

    function achievementCard(item, unlocked) {
      const progress = item.progress || {};
      const current = Number(progress.current || 0);
      const target = Number(progress.target || 1);
      const achievementPoints = Math.max(0, Number(item.points || 0));
      const t = window.ZDWA_I18N?.t || (value => value);
      const unlockedDate = unlocked ? achievementDate(item.unlocked_at) : '';
      const progressText = unlocked
        ? (unlockedDate ? `${t('Erreicht am')} ${unlockedDate}` : t('Erreicht'))
        : `${formatNumber(Math.min(current, target), '0')} / ${formatNumber(target, '0')}`;
      const pointsText = `+${formatNumber(achievementPoints, '0')} ${t('Ehrenberg-Marken')}`;
      return `<article class="achievement-card${unlocked ? ' unlocked' : ' locked'}">
        <span class="achievement-icon achievement-icon-${escapeHtml(item.icon_key || 'default')}" aria-hidden="true">${achievementIcon(item.icon_key)}</span>
        <span class="achievement-copy"><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.description)}</small></span>
        <span class="achievement-status"><span class="achievement-points">${escapeHtml(pointsText)}</span><span class="achievement-progress">${escapeHtml(progressText)}</span></span>
      </article>`;
    }

    try {
      const response = await fetch(`/api/players/${encodeURIComponent(username)}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(response.status === 404 ? 'Spieler wurde nicht gefunden.' : 'Profil konnte nicht geladen werden.');
      const player = (await response.json()).player;
      document.getElementById('profileName').innerHTML = playerNameMarkup(player, { name: player.username });
      statisticsEl.innerHTML = bucket('Gesamt', player.statistics.overall, { details: false })
        + bucket('Normal', player.statistics.normal)
        + bucket('Hardcore', player.statistics.hardcore);
      const achievements = player.achievements || {};
      const unlocked = Array.isArray(achievements.unlocked) ? achievements.unlocked : [];
      const locked = Array.isArray(achievements.locked) ? achievements.locked : [];
      const t = window.ZDWA_I18N?.t || (value => value);
      document.getElementById('achievementSummary').textContent = `${unlocked.length} ${t('von')} ${unlocked.length + locked.length} ${t('erreicht')} · ${formatNumber(achievements.points_earned || 0, '0')} / ${formatNumber(achievements.points_possible || 0, '0')} ${t('Ehrenberg-Marken')}`;
      document.getElementById('unlockedAchievements').innerHTML = unlocked.length
        ? unlocked.map(item => achievementCard(item, true)).join('')
        : '<p class="muted">Noch keine Erfolge erreicht – das erste Ziel wartet bereits.</p>';
      document.getElementById('lockedAchievements').innerHTML = locked.length
        ? locked.map(item => achievementCard(item, false)).join('')
        : '<p class="muted">Alle derzeitigen Erfolge sind erreicht.</p>';
      const recent = Array.isArray(player.recent_games) ? player.recent_games : [];
      if (recent.length) {
        document.getElementById('recentGamesSection').hidden = false;
        document.getElementById('recentGames').innerHTML = recent.map(game => {
          const date = new Intl.DateTimeFormat(window.ZDWA_I18N?.locale?.() || 'de-CH', { dateStyle: 'medium' }).format(new Date(game.finished_at));
          const mode = game.hardcore ? 'Hardcore' : (String(game.mode) === '2v2' ? '2 vs 2' : `${game.mode} Spieler`);
          return `<a class="recent-game-row" href="/ergebnis/${encodeURIComponent(game.game_id)}">
            <span><strong>${escapeHtml(date)}</strong><small>${escapeHtml(mode)}</small></span>
            <strong>${formatNumber(game.points, '0')} Punkte</strong>
          </a>`;
        }).join('');
      }
    } catch (error) {
      errorEl.textContent = error.message;
      errorEl.hidden = false;
    }
  </script>
</body>
</html>
