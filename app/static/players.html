<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Würfler – Spieler &amp; Ranking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png?v=2" sizes="180x180">
  <link rel="stylesheet" href="/static/style.css?v=77">
  <script src="/static/theme.js?v=1"></script>
</head>
<body class="lobby-page">
  <main class="wrap profile-shell">
    <nav class="page-nav"><a href="/">← Lobby</a></nav>
    <section class="card">
      <h1>Spieler suchen</h1>
      <form id="searchForm" class="search-row">
        <input id="searchInput" type="search" placeholder="Benutzername" autocomplete="off">
        <button>Suchen</button>
      </form>
      <div id="searchResults" class="player-search-results muted">Benutzername eingeben oder alle anzeigen.</div>
    </section>
    <section class="card">
      <div class="section-title-row">
        <h1>Spieler-Ranking</h1>
        <div class="ranking-controls">
          <div class="tabs" aria-label="Spielmodus">
            <button id="rankingNormal" class="tab-btn active" type="button">Normal</button>
            <button id="rankingHardcore" class="tab-btn" type="button">Hardcore</button>
          </div>
          <select id="rankingSort" aria-label="Ranking sortieren">
            <option value="games">Meiste Spiele</option>
            <option value="points">Meiste Gesamtpunkte</option>
            <option value="average">Höchster Durchschnitt</option>
            <option value="maximum">Höchste Punktzahl</option>
          </select>
        </div>
      </div>
      <div class="table-scroll">
        <table class="ranking-table">
          <thead><tr><th>#</th><th>Spieler</th><th>Spiele</th><th>Gesamtpunkte</th><th>Ø</th><th>Trend (3)</th><th>Max</th></tr></thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module">
    import { escapeHtml, formatNumber } from '/static/auth.js?v=2';
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const rankingSort = document.getElementById('rankingSort');
    const rankingNormal = document.getElementById('rankingNormal');
    const rankingHardcore = document.getElementById('rankingHardcore');
    const rankingBody = document.getElementById('rankingBody');
    const profileUrl = username => `/static/profile.html?user=${encodeURIComponent(username)}`;
    let rankingMode = 'normal';

    async function searchPlayers() {
      const response = await fetch(`/api/players/search?query=${encodeURIComponent(searchInput.value.trim())}`, { cache: 'no-store' });
      const players = response.ok ? (await response.json()).players : [];
      searchResults.classList.remove('muted');
      searchResults.innerHTML = players.map(player =>
        `<a class="player-result" href="${profileUrl(player.username)}">${escapeHtml(player.username)}</a>`
      ).join('') || '<span class="muted">Keine Spieler gefunden.</span>';
    }

    async function loadRanking() {
      rankingBody.innerHTML = '<tr><td colspan="7" class="muted">Laden…</td></tr>';
      const response = await fetch(`/api/players/ranking?mode=${rankingMode}&sort=${encodeURIComponent(rankingSort.value)}`, { cache: 'no-store' });
      const players = response.ok ? (await response.json()).players : [];
      rankingBody.innerHTML = players.map(player => {
        const trend = player.trend === 'up'
          ? { symbol: '↑', text: 'Positiv', css: 'avg-up' }
          : player.trend === 'down'
            ? { symbol: '↓', text: 'Negativ', css: 'avg-down' }
            : { symbol: '–', text: 'Stagnierend', css: 'avg-same' };
        const trendTitle = player.trend_games < 3
          ? 'Noch keine drei Spiele in diesem Modus vorhanden'
          : `Ø der letzten 3 Spiele: ${formatNumber(player.recent_average_points)}`;
        return `<tr>
        <td>${player.rank}</td>
        <td><a href="${profileUrl(player.username)}">${escapeHtml(player.username)}</a></td>
        <td>${formatNumber(player.games_played, '0')}</td>
        <td>${formatNumber(player.points_total, '0')}</td>
        <td>${formatNumber(player.average_points)}</td>
        <td><span class="avg-trend ${trend.css}" title="${escapeHtml(trendTitle)}" aria-label="${escapeHtml(trendTitle)}">${trend.symbol} ${trend.text}</span></td>
        <td>${formatNumber(player.max_points)}</td>
      </tr>`;
      }).join('') || '<tr><td colspan="7" class="muted">Noch keine registrierten Spieler.</td></tr>';
    }

    searchForm.addEventListener('submit', event => { event.preventDefault(); searchPlayers(); });
    rankingSort.addEventListener('change', loadRanking);
    function setRankingMode(mode) {
      rankingMode = mode;
      rankingNormal.classList.toggle('active', mode === 'normal');
      rankingHardcore.classList.toggle('active', mode === 'hardcore');
      loadRanking();
    }
    rankingNormal.addEventListener('click', () => setRankingMode('normal'));
    rankingHardcore.addEventListener('click', () => setRankingMode('hardcore'));
    await Promise.all([searchPlayers(), loadRanking()]);
  </script>
</body>
</html>
