name: Quality

on:
  push:
    # Feature branches are checked once, through their pull request. Integrated
    # develop states and master promotions run on push; release tags point to
    # revisions already checked on their branch.
    branches: ["develop", "master"]
  pull_request:

# A newer push to the same pull request or branch supersedes its older run.
# Other pull requests, branches and event types keep separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The complete lint, backend, browser, tool and image suites run locally
  # before every push. GitHub only verifies the owner's "Local verification"
  # status for the exact tree and base, and that the remote integration kept
  # what was checked. It never falls back to running the suites itself;
  # scripts/ci_release_evidence.py documents every accepted case.
  result:
    name: Quality result
    runs-on: ubuntu-latest
    # Covers the bounded wait for a status published right after the push.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_release_evidence.py
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release_evidence.py verify
