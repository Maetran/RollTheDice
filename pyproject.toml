[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app", "scripts"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
# B105 mistakes optional passphrase state for a hard-coded secret. B310 is a
# fixed HTTPS request to Cloudflare Turnstile, not a user-controlled URL.
skips = ["B105", "B310"]
